on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

name: run tests

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Run linters
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        go-version: [stable]
        # Windows is excluded: shell-script-based procs require bash/sh.
        # Docker tests on ubuntu use the pre-installed daemon; on macOS they are
        # skipped automatically via requireDocker() when the daemon is absent.
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Run tests
        run: go test -race -v -timeout 300s ./...

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      # Coverage runs on ubuntu where both shell and Docker tests execute.
      - name: Generate coverage profile
        run: go test -v -timeout 300s -coverprofile=profile.cov ./...
      - name: Upload coverage to Coveralls
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: profile.cov
          parallel: true

  finish:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: shogo82148/actions-goveralls@v1
        with:
          parallel-finished: true
